    <meta name="cloudflare-analytics" content="off" />
    <meta name="cf-beacon" content="disabled" />
    
    <!-- Robust Ad-Blocker & Cloudflare Analytics Error Interceptor -->
    <script>
      (function() {
        window.__cfBeacon = window.__cfBeacon || { token: '' };
        window.addEventListener('error', function(e) {
          var target = e.target || e.srcElement;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            if (src.indexOf('cloudflareinsights') !== -1 || src.indexOf('beacon.min.js') !== -1) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
