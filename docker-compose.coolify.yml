version: '3.8'

services:
  # 1. Web Dashboard (React SPA + Nginx Reverse Proxy to API)
  web:
    image: ghcr.io/kachakaran6/cron-web:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '80'
    labels:
      - "caddy=https://cron.samast.pro, http://cron.samast.pro, http://cron.3.110.164.62.sslip.io, http://3.110.164.62"
      - "caddy.reverse_proxy={{upstreams 80}}"
      - "caddy.networks=coolify"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - coolify

  # 2. NestJS REST & OpenAPI API Server
  api:
    image: ghcr.io/kachakaran6/cron-api:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      FRONTEND_URL: ${FRONTEND_URL:-https://cron.samast.pro}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://cron.samast.pro}
      JWT_SECRET: ${JWT_SECRET:-samast_cron_jwt_secret_change_in_production_2026}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-b5e8f498c39d8461719c8fba5a4c9c1b72e90c8831ef09c0d123456789abcdef}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    networks:
      - default
      - coolify

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cron_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cron_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cron_saas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cron_user} -d ${POSTGRES_DB:-cron_saas} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  # 4. Redis Queue & Lock Manager
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_secure_pass_2026} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - redis_data:/data
    networks:
      - default

networks:
  default:
  coolify:
    name: coolify
    external: true

volumes:
  postgres_data:
  redis_data:
