version: '3.8'

services:
  # 1. Web Dashboard (React SPA + Nginx Reverse Proxy to API)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - api
    ports:
      - '80:80'

  # 2. NestJS REST & OpenAPI API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        SCOPE: api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://b9isp2rfba3f3nrouxuqvqsr.137.23.49.73.sslip.io}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-b5e8f498c39d8461719c8fba5a4c9c1b72e90c8831ef09c0d123456789abcdef}
    expose:
      - '4000'

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cron_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cron_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cron_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 4. Redis Queue & Lock Manager
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    volumes:
      - redis_data:/data

  # 5. Distributed Scheduler Microservice
  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
      args:
        SCOPE: scheduler
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}

  # 6. Isolated HTTP Execution Worker Pool
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        SCOPE: worker
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      WORKER_CONCURRENCY: 50

volumes:
  postgres_data:
  redis_data:
