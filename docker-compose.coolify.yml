version: '3.8'

services:
  # 1. Web Dashboard (React SPA + Nginx Reverse Proxy to API)
  web:
    image: ghcr.io/kachakaran6/cron-web:latest
    restart: always
    depends_on:
      api:
        condition: service_healthy
    expose:
      - '80'
    labels:
      - "caddy=http://cron.samast.pro, http://cron.3.110.164.62.sslip.io, http://3.110.164.62"
      - "caddy.reverse_proxy={{upstreams 80}}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - coolify

  # 2. NestJS REST & OpenAPI API Server
  api:
    image: ghcr.io/kachakaran6/cron-api:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      FRONTEND_URL: ${FRONTEND_URL:-https://cron.samast.pro}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-b5e8f498c39d8461719c8fba5a4c9c1b72e90c8831ef09c0d123456789abcdef}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - coolify

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cron_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cron_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cron_saas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cron_user} -d ${POSTGRES_DB:-cron_saas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  # 4. Redis Queue & Lock Manager
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_secure_pass_2026} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - default

  # 5. Distributed Scheduler Microservice
  scheduler:
    image: ghcr.io/kachakaran6/cron-api:latest
    command: ["node", "apps/scheduler/dist/main.js"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
    networks:
      - default

  # 6. Isolated HTTP Execution Worker Pool
  worker:
    image: ghcr.io/kachakaran6/cron-api:latest
    command: ["node", "apps/worker/dist/main.js"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cron_user}:${POSTGRES_PASSWORD:-cron_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-cron_saas}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      WORKER_CONCURRENCY: 50
    networks:
      - default

networks:
  default:
  coolify:
    name: coolify
    external: true

volumes:
  postgres_data:
  redis_data:
